<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0c10">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./nexus-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" sizes="192x192" href="./nexus-icon-192.png">
    <title>Modern Kígyós Játék - AI</title>
    <style>
        body {
            background: linear-gradient(135deg, #1e1e2f, #111119);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .back-home {
            position: fixed;
            z-index: 10;
            top: 16px;
            left: 18px;
            display: inline-flex;
            min-height: 42px;
            align-items: center;
            padding: 0 15px;
            border: 1px solid rgba(0, 242, 254, .55);
            border-radius: 999px;
            background: rgba(13, 25, 38, .92);
            color: #b9fffb;
            font-size: .9rem;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 0 18px rgba(0, 242, 254, .18);
            transition: background 180ms ease, box-shadow 180ms ease, transform 180ms ease;
        }
        .back-home:hover {
            transform: translateY(-1px);
            background: #15343a;
            box-shadow: 0 0 24px rgba(0, 242, 254, .36);
        }
        .back-home:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 3px;
        }
        h1 {
            margin-bottom: 10px;
            font-size: 2.5rem;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 10px rgba(0,242,254,0.2);
        }
        #score-board {
            font-size: 1.2rem;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }
        #game-container {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border: 4px solid #4facfe;
        }
        canvas {
            background-color: #1a1a24;
            display: block;
        }
        #game-over {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(17, 17, 25, 0.85);
            backdrop-filter: blur(5px);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ff4b5c;
            font-size: 2.5rem;
            font-weight: bold;
        }
        #start-menu {
            display: flex;
            position: absolute;
            inset: 0;
            background: rgba(17, 17, 25, 0.9);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #fff;
            font-size: 1.2rem;
        }
        #difficulty {
            min-width: 180px;
            padding: 10px 12px;
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 8px;
            background: #1a1a24;
            color: #fff;
            font: inherit;
        }
        .game-over-actions {
            display: flex;
            gap: 12px;
        }
        .game-over-actions button {
            padding-right: 16px;
            padding-left: 16px;
        }
        button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 1rem;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            border: none;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
        }
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.6);
        }
        #d-pad {
            display: grid;
            grid-template-areas:
                ". up ."
                "left . right"
                ". down .";
            grid-template-columns: repeat(3, 48px);
            grid-template-rows: repeat(3, 48px);
            gap: 4px;
            padding: 10px;
            margin-top: 16px;
            border: 1px solid rgba(0, 242, 254, 0.35);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(20, 44, 46, 0.96), rgba(12, 18, 25, 0.96));
            box-shadow: 0 0 24px rgba(0, 242, 254, 0.14), inset 0 0 18px rgba(0, 242, 254, 0.08);
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .direction-button {
            display: grid;
            place-items: center;
            width: 48px;
            height: 48px;
            margin: 0;
            padding: 0;
            border: 1px solid rgba(0, 242, 254, 0.62);
            border-radius: 15px;
            background: linear-gradient(145deg, #17383b, #102329);
            color: #b9fffb;
            font-size: 1.45rem;
            line-height: 1;
            box-shadow: 0 3px 12px rgba(0, 242, 254, 0.16), inset 0 0 10px rgba(0, 242, 254, 0.08);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: transform 100ms ease, background 100ms ease, box-shadow 100ms ease;
        }
        .direction-button:active,
        .direction-button.is-active {
            transform: scale(0.9);
            background: linear-gradient(145deg, #00c8b9, #087f7b);
            color: #fff;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.65), inset 0 0 12px rgba(255, 255, 255, 0.2);
        }
        .direction-button:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 2px;
        }
        .direction-button[data-direction="up"] { grid-area: up; }
        .direction-button[data-direction="left"] { grid-area: left; }
        .direction-button[data-direction="right"] { grid-area: right; }
        .direction-button[data-direction="down"] { grid-area: down; }
        @media (max-width: 600px) {
            body {
                box-sizing: border-box;
                min-height: 100vh;
                min-height: 100svh;
                height: auto;
                justify-content: flex-start;
                overflow-x: hidden;
                overflow-y: auto;
                padding: 64px 12px 20px;
            }
            .back-home {
                top: 10px;
                left: 12px;
                min-height: 40px;
                font-size: .84rem;
            }
            h1 {
                margin: 4px 0 8px;
                font-size: clamp(1.8rem, 8vw, 2.5rem);
            }
            #score-board {
                margin-bottom: 12px;
                padding: 8px 14px;
                font-size: 1rem;
            }
            #game-container {
                max-width: 100%;
                border-width: 3px;
            }
            canvas {
                width: min(400px, calc(100vw - 38px), calc(100vh - 324px));
                width: min(400px, calc(100vw - 38px), calc(100svh - 324px));
                height: auto;
            }
            #d-pad {
                margin-top: 12px;
            }
        }
    </style>
</head>
<body>
    <a class="back-home" href="index.html">← Back to Portfolio</a>
    <h1>NEON SNAKE</h1>
    <div id="score-board">Pontszám: <span id="score">0</span> | Rekord: <span id="high-score">0</span></div>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="start-menu">
            <label for="difficulty">Nehézségi szint</label>
            <select id="difficulty">
                <option value="160">Lassú</option>
                <option value="100" selected>Közepes</option>
                <option value="60">Gyors</option>
            </select>
            <button onclick="startGame()">Játék indítása</button>
        </div>
        <div id="game-over">
            JÁTÉK VÉGE
            <div class="game-over-actions">
                <button onclick="resetGame()">Új játék</button>
                <button onclick="backToMenu()">Vissza a menübe</button>
            </div>
        </div>
    </div>
    <div id="d-pad" role="group" aria-label="Érintéses irányítás">
        <button class="direction-button" type="button" data-direction="up" aria-label="Fel" title="Fel">▲</button>
        <button class="direction-button" type="button" data-direction="left" aria-label="Balra" title="Balra">◀</button>
        <button class="direction-button" type="button" data-direction="right" aria-label="Jobbra" title="Jobbra">▶</button>
        <button class="direction-button" type="button" data-direction="down" aria-label="Le" title="Le">▼</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const highScoreElement = document.getElementById("high-score");
        const startMenu = document.getElementById("start-menu");
        const difficultyElement = document.getElementById("difficulty");
        const gameOverScreen = document.getElementById("game-over");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{x: 10, y: 10}];
        let food = {x: 5, y: 5};
        let dx = 1;
        let dy = 0;
        let score = 0;
        let highScore = Number(localStorage.getItem("neonSnakeHighScore")) || 0;
        let gameInterval;
        let gameRunning = false;

        highScoreElement.innerText = highScore;
        window.addEventListener("keydown", event => {
            const directions = {
                ArrowLeft: "left",
                ArrowUp: "up",
                ArrowRight: "right",
                ArrowDown: "down"
            };
            const direction = directions[event.key];
            if (direction) {
                event.preventDefault();
                changeDirection(direction);
            }
        });
        document.querySelectorAll(".direction-button").forEach(button => {
            button.addEventListener("touchstart", event => {
                event.preventDefault();
                button.classList.add("is-active");
                changeDirection(button.dataset.direction);
                if (navigator.vibrate) navigator.vibrate(12);
            }, { passive: false });
            button.addEventListener("touchend", () => button.classList.remove("is-active"));
            button.addEventListener("touchcancel", () => button.classList.remove("is-active"));
            button.addEventListener("mousedown", () => {
                button.classList.add("is-active");
                changeDirection(button.dataset.direction);
            });
            button.addEventListener("click", () => changeDirection(button.dataset.direction));
            button.addEventListener("mouseup", () => button.classList.remove("is-active"));
            button.addEventListener("mouseleave", () => button.classList.remove("is-active"));
        });

        function startGame() {
            startMenu.style.display = "none";
            resetGame();
        }

        function gameLoop() {
            if (!gameRunning) return;
            moveSnake();
            if (checkCollision()) {
                endGame();
                return;
            }
            checkFoodEat();
            draw();
        }

        function draw() {
            // Háttér tisztítása mintával
            ctx.fillStyle = "#1a1a24";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Kígyó kirajzolása neon effektusokkal
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#00f2fe" : "#4facfe";
                ctx.shadowBlur = 10;
                ctx.shadowColor = "#00f2fe";
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });

            // Étel kirajzolása
            ctx.fillStyle = "#ff4b5c";
            ctx.shadowColor = "#ff4b5c";
            ctx.shadowBlur = 15;
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
            ctx.shadowBlur = 0; // Reset effekt
        }

        function moveSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);
            snake.pop();
        }

        function changeDirection(direction) {
            if (!gameRunning) return;

            if (direction === "left" && dx === 0) { dx = -1; dy = 0; }
            if (direction === "up" && dy === 0) { dx = 0; dy = -1; }
            if (direction === "right" && dx === 0) { dx = 1; dy = 0; }
            if (direction === "down" && dy === 0) { dx = 0; dy = 1; }
        }

        function checkCollision() {
            const head = snake[0];
            // Falak ellenőrzése
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) return true;
            // Önmagának ütközés
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) return true;
            }
            return false;
        }

        function checkFoodEat() {
            if (snake[0].x === food.x && snake[0].y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                if (score > highScore) {
                    highScore = score;
                    highScoreElement.innerText = highScore;
                    localStorage.setItem("neonSnakeHighScore", highScore);
                }
                snake.push({}); // Növekszik a kígyó
                generateFood();
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            // Ne generálódjon a kígyóra az étel
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) generateFood();
            });
        }

        function endGame() {
            gameRunning = false;
            clearInterval(gameInterval);
            gameOverScreen.style.display = "flex";
        }

        function backToMenu() {
            gameRunning = false;
            clearInterval(gameInterval);
            gameOverScreen.style.display = "none";
            startMenu.style.display = "flex";
        }

        function resetGame() {
            snake = [{x: 10, y: 10}, {x: 9, y: 10}];
            generateFood();
            dx = 1; dy = 0;
            score = 0;
            scoreElement.innerText = score;
            gameRunning = true;
            startMenu.style.display = "none";
            gameOverScreen.style.display = "none";
            clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, Number(difficultyElement.value));
        }
    </script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./sw.js")
                    .catch(error => console.error("Service Worker registration failed:", error));
            });
        }
    </script>
</body>
</html>
